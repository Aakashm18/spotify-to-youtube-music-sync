[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spotify-to-youtube-music-sync"
version = "1.1.0"
description = "Automatically mirror your Spotify Liked Songs to a YouTube playlist using GitHub Actions."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "spotify-to-youtube-music-sync contributors" }]
requires-python = ">=3.10"
keywords = [
    "spotify", "youtube", "sync", "music", "playlist",
    "github-actions", "automation", "oauth",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "google-api-python-client==2.126.0",
    "google-auth==2.29.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.0",
    "spotipy==2.25.2",
    "requests==2.31.0",
]

[project.urls]
Homepage = "https://github.com/Aakashm18/spotify-to-youtube-music-sync"
Repository = "https://github.com/Aakashm18/spotify-to-youtube-music-sync"
Issues = "https://github.com/Aakashm18/spotify-to-youtube-music-sync/issues"
Changelog = "https://github.com/Aakashm18/spotify-to-youtube-music-sync/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "flake8==7.0.0",
    "isort==5.13.2",
    "mypy==1.10.0",
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "pre-commit==3.7.1",
    "types-requests",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", "setup.py"]
