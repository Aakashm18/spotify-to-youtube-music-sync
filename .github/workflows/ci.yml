name: "✅ CI — Lint & Test"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: "Lint & Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"

      - name: "📦 Install dependencies"
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: "🎨 black — formatting check"
        run: black --check --line-length 100 .

      - name: "📦 isort — import order check"
        run: isort --check-only --profile black --line-length 100 .

      - name: "🔍 flake8 — style lint"
        run: flake8 . --max-line-length 100 --extend-ignore=E203,W503

      - name: "🧪 pytest — unit tests"
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
